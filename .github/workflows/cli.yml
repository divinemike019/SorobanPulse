name: CLI

# Builds and tests the standalone `spulse` crate in cli/, which is not part
# of the root workspace and so is not covered by ci.yml.

on:
  push:
    branches: [main]
    paths:
      - "cli/**"
      - ".github/workflows/cli.yml"
  pull_request:
    paths:
      - "cli/**"
      - ".github/workflows/cli.yml"

permissions:
  contents: read

jobs:
  cli:
    name: Test & Build (spulse)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: cli

      - name: Test
        run: cargo test --locked

      - name: Build release binary
        run: cargo build --release --locked
