name: Secrets Scan

# Issue #943: Automated detection and prevention of secrets in the repository

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'fix/**'
      - 'hotfix/**'
  pull_request:

concurrency:
  group: secrets-scan-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Minimal default permissions.
permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks — detect committed secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0  # Full history needed for git log scanning

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          config-path: .gitleaks.toml

      - name: Upload Gitleaks report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gitleaks-report
          path: results.sarif
          retention-days: 30

  detect-secrets:
    name: detect-secrets — validate baseline
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install detect-secrets
        run: pip install detect-secrets==1.5.0

      - name: Scan with detect-secrets
        run: |
          detect-secrets scan \
            --exclude-files 'Cargo\.lock' \
            --exclude-files '\.env\..*example' \
            --exclude-files '.*\.snap' \
            --exclude-files '.*\.snap\.new' \
            > .secrets.scan-results.json
          echo "Scan complete. Results:"
          cat .secrets.scan-results.json | python3 -m json.tool | head -50

      - name: Check for new secrets against baseline
        run: |
          if [ -f .secrets.baseline ]; then
            echo "Comparing against existing baseline..."
            # If baseline exists, compare — new findings fail the build
            detect-secrets scan \
              --exclude-files 'Cargo\.lock' \
              --exclude-files '\.env\..*example' \
              --exclude-files '.*\.snap' \
              --exclude-files '.*\.snap\.new' \
              | python3 -c "
import sys, json
results = json.load(sys.stdin)
secrets = results.get('results', {})
if any(secrets.values()):
    print('FAIL: Potential secrets detected!')
    for f, items in secrets.items():
        for item in items:
            print(f'  {f}:{item[\"line_number\"]} type={item[\"type\"]}')
    sys.exit(1)
else:
    print('PASS: No secrets detected.')
"
          else
            echo "No baseline file found — treating all findings as informational."
          fi

      - name: Upload scan results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: detect-secrets-results
          path: .secrets.scan-results.json
          retention-days: 30

  audit-secret-exposure:
    name: Log secret scan result to audit trail
    runs-on: ubuntu-latest
    needs: [gitleaks, detect-secrets]
    if: always()
    steps:
      - name: Record scan outcome
        run: |
          STATUS="passed"
          if [ "${{ needs.gitleaks.result }}" != "success" ] || \
             [ "${{ needs.detect-secrets.result }}" != "success" ]; then
            STATUS="failed"
          fi
          echo "Secrets scan result: ${STATUS}"
          echo "Gitleaks: ${{ needs.gitleaks.result }}"
          echo "detect-secrets: ${{ needs.detect-secrets.result }}"
          echo "Commit: ${{ github.sha }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Actor: ${{ github.actor }}"
