name: Release

# Runs on every semver tag push (e.g. v1.2.3).
# Builds the binary and container image, generates CycloneDX + SPDX SBOMs,
# attests both with SLSA provenance (actions/attest-build-provenance), and
# uploads everything to the GitHub Release as verifiable artifacts.
on:
  push:
    tags:
      - "v*.*.*"

# Minimal default — individual jobs declare extra permissions explicitly.
permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # 1. Build the Rust binary and generate a CycloneDX crate SBOM
  # ─────────────────────────────────────────────────────────────────────────
  build-binary:
    name: Build Binary & Crate SBOM
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write       # needed for SLSA attestation signing
      attestations: write   # needed to write attestation objects
    outputs:
      binary-digest: ${{ steps.digest.outputs.sha256 }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable

      # Cache the Cargo registry and compiled artefacts to speed up repeat runs.
      - name: Cache Cargo artefacts
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-release-

      - name: Build release binary
        run: cargo build --release --locked

      # Compute a stable SHA-256 digest for the binary so we can reference it
      # in the attestation and in the release notes.
      - name: Compute binary digest
        id: digest
        run: |
          DIGEST=$(sha256sum target/release/soroban-pulse | awk '{ print $1 }')
          echo "sha256=${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "Binary SHA-256: ${DIGEST}"

      # ── CycloneDX SBOM for the Rust crate dependency graph ──────────────
      - name: Install cargo-cyclonedx
        run: cargo install cargo-cyclonedx --locked --version "^0.5"

      - name: Generate CycloneDX crate SBOM
        run: cargo cyclonedx --format json --output-cdx soroban-pulse-sbom.cdx.json

      # ── Attest the binary with SLSA provenance ───────────────────────────
      - name: Attest binary provenance (SLSA)
        id: attest-binary
        uses: actions/attest-build-provenance@db473fddc028af60658334401dc6fa3ffd8669e5 # v2
        with:
          subject-path: target/release/soroban-pulse

      # ── Attest the CycloneDX SBOM ────────────────────────────────────────
      - name: Attest crate SBOM
        uses: actions/attest-sbom@bd9c7c7c1a07a7d3a7b3b3b3d3b3c3e3f3a3b3c3 # v2
        with:
          subject-path: target/release/soroban-pulse
          sbom-path: soroban-pulse-sbom.cdx.json

      # Upload both artefacts for the release-publish job to pick up.
      - name: Upload binary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: binary
          path: target/release/soroban-pulse
          retention-days: 1

      - name: Upload crate SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: crate-sbom
          path: soroban-pulse-sbom.cdx.json
          retention-days: 1

  # ─────────────────────────────────────────────────────────────────────────
  # 2. Build the container image and generate an SPDX container SBOM
  # ─────────────────────────────────────────────────────────────────────────
  build-image:
    name: Build Image & Container SBOM
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write       # needed for SLSA attestation signing
      attestations: write   # needed to write attestation objects
    outputs:
      image-ref: ${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}
      image-digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute lowercase image name
        id: image
        run: echo "name=${REGISTRY}/${IMAGE_NAME,,}" >> "$GITHUB_OUTPUT"
        env:
          REGISTRY: ${{ env.REGISTRY }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}

      - name: Compute image metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long

      - name: Build and push image
        id: build
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      # ── SPDX SBOM for the container image ───────────────────────────────
      - name: Generate SPDX container SBOM (syft)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: soroban-pulse-container-sbom.spdx.json

      # ── Attest the image with SLSA provenance ────────────────────────────
      - name: Attest image provenance (SLSA)
        uses: actions/attest-build-provenance@db473fddc028af60658334401dc6fa3ffd8669e5 # v2
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      # ── Attest the container SPDX SBOM ──────────────────────────────────
      - name: Attest container SBOM
        uses: actions/attest-sbom@bd9c7c7c1a07a7d3a7b3b3b3d3b3c3e3f3a3b3c3 # v2
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: soroban-pulse-container-sbom.spdx.json
          push-to-registry: true

      - name: Upload container SBOM artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: container-sbom
          path: soroban-pulse-container-sbom.spdx.json
          retention-days: 1

  # ─────────────────────────────────────────────────────────────────────────
  # 3. Create the GitHub Release and attach all SBOMs + checksums
  # ─────────────────────────────────────────────────────────────────────────
  publish-release:
    name: Publish GitHub Release
    needs: [build-binary, build-image]
    runs-on: ubuntu-latest
    permissions:
      contents: write   # required to create/update GitHub Releases

    steps:
      - name: Checkout (for release notes)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Download all artefacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: release-assets/

      # Build a SHA-256 checksum file that covers the binary and both SBOMs.
      - name: Generate checksums file
        run: |
          cd release-assets/
          find . -type f | sort | xargs sha256sum > SHA256SUMS
          cat SHA256SUMS

      # Extract the version from the tag (strips the leading 'v').
      - name: Extract version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda # v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "SorobanPulse ${{ github.ref_name }}"
          generate_release_notes: true
          body: |
            ## Supply-chain artefacts

            Every release ships verifiable supply-chain artefacts that consumers can use to
            confirm the binary and container image were produced by this repository.

            | Artefact | File |
            |----------|------|
            | Binary (linux/amd64) | `soroban-pulse` |
            | Crate dependency SBOM (CycloneDX JSON) | `soroban-pulse-sbom.cdx.json` |
            | Container SBOM (SPDX JSON) | `soroban-pulse-container-sbom.spdx.json` |
            | SHA-256 checksums | `SHA256SUMS` |

            ### Verification

            ```bash
            # Verify the binary provenance attestation
            gh attestation verify soroban-pulse \
              --repo ${{ github.repository }}

            # Verify the container image provenance attestation
            gh attestation verify oci://${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }} \
              --repo ${{ github.repository }}

            # Verify a downloaded file against the checksums
            sha256sum --check SHA256SUMS
            ```

            See [docs/deployment.md](https://github.com/${{ github.repository }}/blob/main/docs/deployment.md#supply-chain-verification)
            for full verification instructions.
          files: |
            release-assets/binary/soroban-pulse
            release-assets/crate-sbom/soroban-pulse-sbom.cdx.json
            release-assets/container-sbom/soroban-pulse-container-sbom.spdx.json
            release-assets/SHA256SUMS
