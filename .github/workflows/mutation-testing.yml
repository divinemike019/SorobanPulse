name: Mutation Testing — Issue #922

on:
  push:
    branches: [main, develop]
    paths:
      - "src/**"
      - "tests/**"
      - "mutants.toml"
      - "Makefile.mutations"
      - ".github/workflows/mutation-testing.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "src/**"
      - "tests/**"
      - "mutants.toml"
  schedule:
    # Full suite weekly on Monday at 02:00 UTC (avoids Monday morning CI rush)
    - cron: "0 2 * * 1"
  workflow_dispatch:
    inputs:
      max_mutations:
        description: "Cap total mutations (0 = unlimited)"
        required: false
        default: "0"

# Minimal default permissions.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  DATABASE_URL: postgres://postgres:postgres@localhost/soroban_pulse_test
  STELLAR_RPC_URL: http://localhost:8000
  # Score thresholds — also documented in mutants.toml
  MUTATION_SCORE_MINIMUM: "70"
  MUTATION_SCORE_TARGET: "80"

jobs:
  # ── Full mutation suite ───────────────────────────────────────────────────
  mutation-testing:
    name: Mutation Testing
    runs-on: ubuntu-latest
    timeout-minutes: 180
    # Needs write to post PR comments and push score history.
    permissions:
      contents: read
      pull-requests: write

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: soroban_pulse_test
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Fetch full history so we can push the score file back on main
          fetch-depth: 0

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          save-if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}

      - name: Install cargo-mutants
        run: cargo install cargo-mutants --locked

      - name: Install sqlx-cli (for migrations)
        run: cargo install sqlx-cli --no-default-features --features postgres --locked

      - name: Run database migrations
        run: sqlx migrate run
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}

      # ── Run mutations ───────────────────────────────────────────────────
      - name: Run mutation tests
        id: mutants
        run: |
          EXTRA_ARGS=""
          if [ "${{ github.event.inputs.max_mutations }}" != "0" ] && [ -n "${{ github.event.inputs.max_mutations }}" ]; then
            EXTRA_ARGS="--in-place"   # placeholder — cargo-mutants doesn't have --maximum yet
          fi
          mkdir -p target/mutants
          cargo mutants \
            --output target/mutants \
            --jobs $(nproc) \
            --timeout 300 \
            $EXTRA_ARGS \
            2>&1 | tee target/mutants/run.log || true
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      # ── Parse score from JSON output ────────────────────────────────────
      - name: Extract mutation score
        id: score
        if: always()
        run: |
          SCORE=0; KILLED=0; SURVIVED=0; UNVIABLE=0
          if [ -f "target/mutants/mutants.json" ]; then
            SCORE=$(jq -r '
              if .summary then
                (.summary.killed // 0) as $k |
                (.summary.survived // 0) as $s |
                if ($k + $s) > 0 then ($k * 100 / ($k + $s)) else 0 end
              else 0 end
            ' target/mutants/mutants.json 2>/dev/null || echo 0)
            KILLED=$(jq -r '.summary.killed // 0' target/mutants/mutants.json 2>/dev/null || echo 0)
            SURVIVED=$(jq -r '.summary.survived // 0' target/mutants/mutants.json 2>/dev/null || echo 0)
            UNVIABLE=$(jq -r '.summary.unviable // 0' target/mutants/mutants.json 2>/dev/null || echo 0)
          fi
          # Round to 1 decimal
          SCORE=$(printf "%.1f" "$SCORE" 2>/dev/null || echo "0.0")
          echo "score=$SCORE"     >> "$GITHUB_OUTPUT"
          echo "killed=$KILLED"   >> "$GITHUB_OUTPUT"
          echo "survived=$SURVIVED" >> "$GITHUB_OUTPUT"
          echo "unviable=$UNVIABLE" >> "$GITHUB_OUTPUT"
          echo "Mutation Score: ${SCORE}%  (killed=${KILLED}, survived=${SURVIVED}, unviable=${UNVIABLE})"

      # ── Per-module score table ──────────────────────────────────────────
      - name: Print per-module score table
        if: always()
        run: |
          if [ -f "target/mutants/mutants.json" ]; then
            node -e "
              const fs = require('fs');
              const data = JSON.parse(fs.readFileSync('target/mutants/mutants.json','utf8'));
              const outcomes = data.outcomes || [];
              const byModule = {};
              function mod(p){ const m=(p||'').match(/src\/([^\/]+)/); return m?m[1].replace('.rs',''):'other'; }
              for (const o of outcomes) {
                const m = mod(o.source_file || o.path || '');
                if (!byModule[m]) byModule[m]={killed:0,survived:0};
                const s=(o.outcome||o.status||'').toLowerCase();
                if(s==='killed') byModule[m].killed++;
                else if(s==='survived'||s==='missed') byModule[m].survived++;
              }
              console.log('\nModule'.padEnd(38)+'Killed'.padStart(8)+'Survived'.padStart(10)+'Score'.padStart(8));
              console.log('-'.repeat(66));
              for(const [m,v] of Object.entries(byModule).sort()){
                const t=v.killed+v.survived;
                const s=t>0?(v.killed/t*100).toFixed(1)+\"%\":\"-\";
                const e=parseFloat(s)>=80?\"✅\":parseFloat(s)>=70?\"🟡\":\"❌\";
                console.log(e+\" \"+m.padEnd(36)+String(v.killed).padStart(8)+String(v.survived).padStart(10)+s.padStart(8));
              }
            " 2>/dev/null || echo "(node not available — score table skipped)"
          fi

      # ── Survivor analysis ───────────────────────────────────────────────
      - name: Generate survivor analysis
        if: always()
        run: |
          if [ -f "target/mutants/mutants.json" ]; then
            node -e "
              const fs = require('fs');
              const data = JSON.parse(fs.readFileSync('target/mutants/mutants.json','utf8'));
              const survivors = (data.outcomes||[]).filter(o=>{
                const s=(o.outcome||o.status||'').toLowerCase();
                return s==='survived'||s==='missed';
              });
              if(survivors.length===0){ console.log('No survivors! 🎉'); process.exit(0); }
              function mod(p){ const m=(p||'').match(/src\/([^\/]+)/); return m?m[1].replace('.rs',''):'other'; }
              const byMod = {};
              for(const s of survivors){
                const m=mod(s.source_file||s.path||'');
                if(!byMod[m]) byMod[m]=[];
                byMod[m].push(s);
              }
              console.log('\n=== Surviving Mutations ===');
              for(const [m,items] of Object.entries(byMod).sort()){
                console.log('\n['+m+'] '+items.length+' survivors');
                for(const item of items){
                  const loc=(item.source_file||item.path||'?')+':'+(item.line||'?');
                  const desc=item.description||item.mutation||'?';
                  console.log('  '+loc+' — '+desc);
                }
              }
            " 2>/dev/null || echo "(node not available)"
          fi

      # ── Save score snapshot ─────────────────────────────────────────────
      - name: Save mutation score snapshot
        if: always()
        run: |
          SCORE="${{ steps.score.outputs.score }}"
          KILLED="${{ steps.score.outputs.killed }}"
          SURVIVED="${{ steps.score.outputs.survived }}"
          DATE=$(date -u +%Y-%m-%d)
          SHA="${{ github.sha }}"
          node -e "
            const fs = require('fs');
            const entry = { date:'${DATE}', sha:'${SHA}'.slice(0,8), score:parseFloat('${SCORE}'), killed:parseInt('${KILLED}'), survived:parseInt('${SURVIVED}') };
            let h = [];
            if (fs.existsSync('mutation-score.json')) { try { h = JSON.parse(fs.readFileSync('mutation-score.json','utf8')); } catch(_){} }
            h.push(entry);
            fs.writeFileSync('mutation-score.json', JSON.stringify(h.slice(-100), null, 2)); // keep last 100 entries
          " 2>/dev/null || python3 -c "
            import json, os
            from datetime import date
            entry = {'date':'${DATE}','sha':'${SHA}'[:8],'score':float('${SCORE}'),'killed':int('${KILLED}'),'survived':int('${SURVIVED}')}
            h = json.load(open('mutation-score.json')) if os.path.exists('mutation-score.json') else []
            h.append(entry); h = h[-100:]
            json.dump(h, open('mutation-score.json','w'), indent=2)
          " 2>/dev/null || true

      # ── Upload artefacts ────────────────────────────────────────────────
      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mutation-testing-report-${{ github.run_id }}
          path: |
            target/mutants/
            mutation-score.json
          retention-days: 30

      # ── PR comment ─────────────────────────────────────────────────────
      - name: Comment on PR with mutation score
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const score    = parseFloat("${{ steps.score.outputs.score }}") || 0;
            const killed   = parseInt("${{ steps.score.outputs.killed }}")  || 0;
            const survived = parseInt("${{ steps.score.outputs.survived }}") || 0;
            const unviable = parseInt("${{ steps.score.outputs.unviable }}") || 0;
            const min      = parseInt("${{ env.MUTATION_SCORE_MINIMUM }}");
            const target   = parseInt("${{ env.MUTATION_SCORE_TARGET }}");

            const emoji = score >= target ? "🟢" : score >= min ? "🟡" : "🔴";
            const verdict = score >= target
              ? "✅ Score meets the target — excellent test coverage."
              : score >= min
              ? "⚠️ Score meets the minimum gate but is below the " + target + "% target. Consider improving tests for surviving mutations."
              : "❌ Score is below the " + min + "% minimum gate. This PR **will fail CI** until the score is raised.";

            const body = [
              "## Mutation Testing Results " + emoji,
              "",
              "| Metric | Value |",
              "|---|---|",
              "| **Mutation Score** | **" + score.toFixed(1) + "%** |",
              "| Killed | " + killed + " |",
              "| Survived | " + survived + " |",
              "| Unviable | " + unviable + " |",
              "| Minimum (CI gate) | " + min + "% |",
              "| Target | " + target + "% |",
              "",
              verdict,
              "",
              "View the [full mutation report](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}) in the workflow artifacts.",
              "",
              "_Run `make -f Makefile.mutations mutants-report` locally to view survivor details._",
            ].join("\n");

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });

      # ── Enforce minimum score gate ──────────────────────────────────────
      - name: Enforce mutation score minimum (${{ env.MUTATION_SCORE_MINIMUM }}%)
        if: always()
        run: |
          SCORE="${{ steps.score.outputs.score }}"
          MIN="${{ env.MUTATION_SCORE_MINIMUM }}"
          echo "Score: ${SCORE}%  Minimum: ${MIN}%"
          # Use awk for float comparison (avoids bc dependency)
          if awk "BEGIN { exit !(${SCORE} < ${MIN}) }"; then
            echo "::error::Mutation score ${SCORE}% is below the ${MIN}% minimum threshold."
            echo "::error::Run 'make -f Makefile.mutations mutants-report' to identify surviving mutations."
            exit 1
          fi
          echo "Score ${SCORE}% passes the ${MIN}% minimum gate."

  # ── Track mutation score trend on main ───────────────────────────────────
  mutation-trend:
    name: Update Mutation Score Trend
    runs-on: ubuntu-latest
    needs: mutation-testing
    # Only commit the updated score history back to main
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && success()
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Download score snapshot
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: mutation-testing-report-${{ github.run_id }}
          path: _mutation_artifacts/

      - name: Commit updated score history
        run: |
          if [ -f "_mutation_artifacts/mutation-score.json" ]; then
            cp _mutation_artifacts/mutation-score.json mutation-score.json
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add mutation-score.json
          git diff --cached --quiet || git commit -m "chore: update mutation score history [skip ci]"
          git push
        continue-on-error: true
