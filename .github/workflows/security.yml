name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly vulnerability scan — Sundays at 02:00 UTC
    - cron: '0 2 * * 0'
  workflow_dispatch:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

# Minimal default permissions.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# ---------------------------------------------------------------------------
# Jobs
# ---------------------------------------------------------------------------

jobs:

  # --------------------------------------------------------------------------
  # 1. Dependency vulnerability audit (cargo-audit)
  #    Checks the Cargo.lock against the RustSec advisory database.
  #    Separate from cargo-deny so we get fine-grained advisory output.
  # --------------------------------------------------------------------------
  cargo-audit:
    name: Dependency Audit (cargo-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: Cache cargo registry
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-audit-${{ hashFiles('Cargo.lock') }}

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked --version "^0.21"

      - name: Run cargo-audit
        run: |
          cargo audit \
            --deny warnings \
            --deny unsound \
            --color always \
            2>&1 | tee audit-report.txt

      - name: Upload audit report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: cargo-audit-report
          path: audit-report.txt
          retention-days: 90

  # --------------------------------------------------------------------------
  # 2. Dependency policy check (cargo-deny)
  #    Enforces advisory, license, banned-crate, and source policies.
  # --------------------------------------------------------------------------
  cargo-deny:
    name: Dependency Policy (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check all
          arguments: --all-features

  # --------------------------------------------------------------------------
  # 3. Security test suite
  #    Runs the dedicated tests/security/* modules:
  #      - OWASP Top 10 coverage
  #      - Auth bypass scenarios
  #      - Cryptographic strength verification
  #      - Security regression tests
  # --------------------------------------------------------------------------
  security-tests:
    name: Security Test Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-security-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-security-
            ${{ runner.os }}-cargo-

      - name: Run security test suite
        # Run all sub-modules. No DATABASE_URL needed — all tests are pure unit tests.
        run: cargo test --test security -- --nocapture 2>&1

      - name: Run zero-trust security tests
        run: cargo test --test zero_trust_security_tests -- --nocapture 2>&1

  # --------------------------------------------------------------------------
  # 4. Secrets detection
  #    Scans source code for hardcoded credentials and sensitive values.
  # --------------------------------------------------------------------------
  secrets-scan:
    name: Secrets Detection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0  # Full history so we can scan recent commits too

      - name: Run secrets check script
        run: bash scripts/check_secrets.sh

      - name: Verify .gitignore protects .env files
        run: |
          grep -qE '^\.env$' .gitignore \
            && echo "✓ .env is gitignored" \
            || (echo "✗ .env is not in .gitignore — add it!" && exit 1)

      - name: Check for accidentally committed .env files
        run: |
          if git ls-files --error-unmatch .env 2>/dev/null; then
            echo "✗ .env file is tracked by git!"
            exit 1
          fi
          echo "✓ .env is not tracked by git"

  # --------------------------------------------------------------------------
  # 5. Unsafe code audit (cargo-geiger)
  #    Reports the number of unsafe blocks per crate. Non-blocking — we collect
  #    the report as an artifact for review rather than failing the build.
  # --------------------------------------------------------------------------
  unsafe-audit:
    name: Unsafe Code Audit (cargo-geiger)
    runs-on: ubuntu-latest
    continue-on-error: true   # Advisory — does not block merge
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-geiger-${{ hashFiles('**/Cargo.lock') }}

      - name: Install cargo-geiger
        run: cargo install cargo-geiger --locked

      - name: Run cargo-geiger
        run: cargo geiger --all-features 2>&1 | tee geiger-report.txt || true

      - name: Upload geiger report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: geiger-unsafe-report
          path: geiger-report.txt
          retention-days: 30

  # --------------------------------------------------------------------------
  # 6. Clippy security lints
  #    Runs clippy with additional security-relevant lints enabled.
  # --------------------------------------------------------------------------
  clippy-security:
    name: Clippy Security Lints
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: clippy

      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-clippy-security-${{ hashFiles('**/Cargo.lock') }}

      - name: Run clippy with security lints
        run: |
          cargo clippy --all-targets --all-features -- \
            -D warnings \
            -W clippy::arithmetic_side_effects \
            -W clippy::integer_division \
            -W clippy::panic \
            -W clippy::unwrap_used \
            -W clippy::expect_used \
            -A clippy::expect_used \
            -A clippy::unwrap_used 2>&1
        # Note: unwrap/expect are allowed but the other side-effect lints are warnings.
        # Adjust -A/-D flags as the codebase matures.
        continue-on-error: true  # Advisory until codebase is hardened

  # --------------------------------------------------------------------------
  # 7. SBOM generation (weekly + on release)
  #    Produces a Software Bill of Materials for supply chain transparency.
  # --------------------------------------------------------------------------
  sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: Install cargo-cyclonedx
        run: cargo install cargo-cyclonedx --locked

      - name: Generate SBOM (CycloneDX format)
        run: cargo cyclonedx --format json --output-file sbom.json

      - name: Upload SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom-cyclonedx
          path: sbom.json
          retention-days: 365
