name: Load Tests

on:
  # Run automatically on pushes to main and weekly for trend data
  push:
    branches: [main]
    paths:
      - "src/**"
      - "migrations/**"
      - "tests/load/**"
      - ".github/workflows/load-tests.yml"
  schedule:
    - cron: "0 3 * * 1"   # Every Monday at 03:00 UTC
  # Allow manual triggers with scenario selection
  workflow_dispatch:
    inputs:
      scenario:
        description: "Scenario to run (leave empty for all CI scenarios)"
        required: false
        default: ""
      db_size:
        description: "Database size for regression check (100k | 1M | 10M)"
        required: false
        default: "1M"
      soak_duration:
        description: "Soak test duration override (e.g. 30m for quick validation)"
        required: false
        default: "30m"

# Minimal default permissions.
permissions:
  contents: read

env:
  BASE_URL: "http://localhost:3000"
  DATABASE_URL: "postgres://postgres:postgres@localhost/soroban_pulse_test"
  STELLAR_RPC_URL: "http://localhost:8000"

jobs:
  # ── Build the service under test ───────────────────────────────────────────
  build:
    name: Build Service
    runs-on: ubuntu-latest
    outputs:
      binary_path: ${{ steps.build.outputs.binary_path }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          save-if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}

      - name: Build release binary
        id: build
        run: |
          cargo build --release
          echo "binary_path=target/release/soroban-pulse" >> "$GITHUB_OUTPUT"

      - name: Upload binary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: soroban-pulse-binary
          path: target/release/soroban-pulse
          retention-days: 1

  # ── Steady-state baseline (events.js) ─────────────────────────────────────
  load-events-steady:
    name: "Load: Events Steady (100 req/s)"
    runs-on: ubuntu-latest
    needs: build

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: soroban_pulse_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download binary
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: soroban-pulse-binary
          path: target/release/

      - name: Make binary executable
        run: chmod +x target/release/soroban-pulse

      - name: Install k6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring \
            --keyring /usr/share/keyrings/k6-archive-keyring.gpg \
            --keyserver hkp://keyserver.ubuntu.com:80 \
            --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" \
            | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install -y k6

      - name: Seed database
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres soroban_pulse_test \
            -f tests/e2e/seed.sql || true

      - name: Start service
        run: |
          RUST_LOG=warn \
          DATABASE_URL=$DATABASE_URL \
          STELLAR_RPC_URL=$STELLAR_RPC_URL \
          PORT=3000 \
          nohup target/release/soroban-pulse &
          echo $! > /tmp/service.pid
          sleep 5
          curl -sf http://localhost:3000/healthz/ready || (cat /tmp/soroban-pulse.log; exit 1)

      - name: Run events steady-state load test
        run: |
          mkdir -p tests/load/results
          k6 run \
            --out json=tests/load/results/events_steady_raw.json \
            -e BASE_URL=$BASE_URL \
            tests/load/events.js

      - name: Run regression check
        run: |
          node tests/load/regression_check.js \
            events_steady \
            tests/load/results/events_steady_raw.json \
            tests/load/baselines.json \
            ${{ github.event.inputs.db_size || '1M' }}

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: results-events-steady
          path: tests/load/results/
          retention-days: 30

      - name: Stop service
        if: always()
        run: kill $(cat /tmp/service.pid) || true

  # ── Stress test (2×→10× ramp) ─────────────────────────────────────────────
  load-stress:
    name: "Load: Stress (2x→10x ramp)"
    runs-on: ubuntu-latest
    needs: build
    # Only run on push to main or manual trigger; skip on regular PRs to save time
    if: >
      github.event_name == 'push' ||
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch'

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: soroban_pulse_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download binary
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: soroban-pulse-binary
          path: target/release/

      - run: chmod +x target/release/soroban-pulse

      - name: Install k6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring \
            --keyring /usr/share/keyrings/k6-archive-keyring.gpg \
            --keyserver hkp://keyserver.ubuntu.com:80 \
            --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" \
            | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update && sudo apt-get install -y k6

      - name: Seed database
        run: PGPASSWORD=postgres psql -h localhost -U postgres soroban_pulse_test -f tests/e2e/seed.sql || true

      - name: Start service
        run: |
          RUST_LOG=warn DATABASE_URL=$DATABASE_URL STELLAR_RPC_URL=$STELLAR_RPC_URL PORT=3000 \
          nohup target/release/soroban-pulse &
          echo $! > /tmp/service.pid
          sleep 5

      - name: Run stress test
        run: |
          mkdir -p tests/load/results
          k6 run --out json=tests/load/results/stress_raw.json -e BASE_URL=$BASE_URL tests/load/stress.js

      - name: Run regression check
        run: |
          node tests/load/regression_check.js stress \
            tests/load/results/stress_raw.json \
            tests/load/baselines.json \
            ${{ github.event.inputs.db_size || '1M' }}

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: results-stress
          path: tests/load/results/
          retention-days: 30

      - if: always()
        run: kill $(cat /tmp/service.pid) || true

  # ── Spike test ────────────────────────────────────────────────────────────
  load-spike:
    name: "Load: Spike (10x burst)"
    runs-on: ubuntu-latest
    needs: build
    if: >
      github.event_name == 'push' ||
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch'

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: soroban_pulse_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { name: soroban-pulse-binary, path: target/release/ }
      - run: chmod +x target/release/soroban-pulse

      - name: Install k6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring \
            --keyring /usr/share/keyrings/k6-archive-keyring.gpg \
            --keyserver hkp://keyserver.ubuntu.com:80 \
            --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" \
            | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update && sudo apt-get install -y k6

      - name: Seed & start
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres soroban_pulse_test -f tests/e2e/seed.sql || true
          RUST_LOG=warn DATABASE_URL=$DATABASE_URL STELLAR_RPC_URL=$STELLAR_RPC_URL PORT=3000 \
          nohup target/release/soroban-pulse &
          echo $! > /tmp/service.pid && sleep 5

      - run: |
          mkdir -p tests/load/results
          k6 run --out json=tests/load/results/spike_raw.json -e BASE_URL=$BASE_URL tests/load/spike.js

      - run: |
          node tests/load/regression_check.js spike \
            tests/load/results/spike_raw.json \
            tests/load/baselines.json \
            ${{ github.event.inputs.db_size || '1M' }}

      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: results-spike, path: tests/load/results/, retention-days: 30 }

      - if: always()
        run: kill $(cat /tmp/service.pid) || true

  # ── Multi-contract query patterns ─────────────────────────────────────────
  load-multi-contract:
    name: "Load: Multi-Contract Queries"
    runs-on: ubuntu-latest
    needs: build

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: soroban_pulse_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { name: soroban-pulse-binary, path: target/release/ }
      - run: chmod +x target/release/soroban-pulse

      - name: Install k6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring \
            --keyring /usr/share/keyrings/k6-archive-keyring.gpg \
            --keyserver hkp://keyserver.ubuntu.com:80 \
            --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" \
            | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update && sudo apt-get install -y k6

      - name: Seed & start
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres soroban_pulse_test -f tests/e2e/seed.sql || true
          RUST_LOG=warn DATABASE_URL=$DATABASE_URL STELLAR_RPC_URL=$STELLAR_RPC_URL PORT=3000 \
          nohup target/release/soroban-pulse &
          echo $! > /tmp/service.pid && sleep 5

      - run: |
          mkdir -p tests/load/results
          k6 run --out json=tests/load/results/multi_contract_raw.json \
            -e BASE_URL=$BASE_URL tests/load/multi_contract.js

      - run: |
          node tests/load/regression_check.js multi_contract \
            tests/load/results/multi_contract_raw.json \
            tests/load/baselines.json \
            ${{ github.event.inputs.db_size || '1M' }}

      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: results-multi-contract, path: tests/load/results/, retention-days: 30 }

      - if: always()
        run: kill $(cat /tmp/service.pid) || true

  # ── Complex filter combinations ───────────────────────────────────────────
  load-filter-scenarios:
    name: "Load: Filter Combinations"
    runs-on: ubuntu-latest
    needs: build

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: soroban_pulse_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { name: soroban-pulse-binary, path: target/release/ }
      - run: chmod +x target/release/soroban-pulse

      - name: Install k6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring \
            --keyring /usr/share/keyrings/k6-archive-keyring.gpg \
            --keyserver hkp://keyserver.ubuntu.com:80 \
            --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" \
            | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update && sudo apt-get install -y k6

      - name: Seed & start
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres soroban_pulse_test -f tests/e2e/seed.sql || true
          RUST_LOG=warn DATABASE_URL=$DATABASE_URL STELLAR_RPC_URL=$STELLAR_RPC_URL PORT=3000 \
          nohup target/release/soroban-pulse &
          echo $! > /tmp/service.pid && sleep 5

      - name: Run filter scenarios load test
        run: |
          mkdir -p tests/load/results
          k6 run --out json=tests/load/results/filter_scenarios_raw.json \
            -e BASE_URL=$BASE_URL tests/load/filter_scenarios.js

      - name: Run regression check
        run: |
          node tests/load/regression_check.js filter_scenarios \
            tests/load/results/filter_scenarios_raw.json \
            tests/load/baselines.json \
            ${{ github.event.inputs.db_size || '1M' }}

      - name: Archive results
        run: |
          node tests/load/lib/results.js archive filter_scenarios \
            tests/load/results/filter_scenarios_raw.json \
            ${{ github.event.inputs.db_size || '1M' }} || true

      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: results-filter-scenarios, path: tests/load/results/, retention-days: 30 }

      - if: always()
        run: kill $(cat /tmp/service.pid) || true

  # ── Soak test (weekly only — too long for every PR) ────────────────────────
  load-soak:
    name: "Load: Soak Test"
    runs-on: ubuntu-latest
    needs: build
    # Soak only on weekly schedule or explicit workflow_dispatch
    if: >
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch'

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: soroban_pulse_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { name: soroban-pulse-binary, path: target/release/ }
      - run: chmod +x target/release/soroban-pulse

      - name: Install k6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring \
            --keyring /usr/share/keyrings/k6-archive-keyring.gpg \
            --keyserver hkp://keyserver.ubuntu.com:80 \
            --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" \
            | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update && sudo apt-get install -y k6

      - name: Seed & start
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres soroban_pulse_test -f tests/e2e/seed.sql || true
          RUST_LOG=warn DATABASE_URL=$DATABASE_URL STELLAR_RPC_URL=$STELLAR_RPC_URL PORT=3000 \
          nohup target/release/soroban-pulse &
          echo $! > /tmp/service.pid && sleep 5

      - name: Run soak test
        env:
          SOAK_DURATION: ${{ github.event.inputs.soak_duration || '24h' }}
        run: |
          mkdir -p tests/load/results
          k6 run --out json=tests/load/results/soak_raw.json \
            -e BASE_URL=$BASE_URL \
            -e SOAK_DURATION=$SOAK_DURATION \
            tests/load/soak.js

      - run: |
          node tests/load/regression_check.js soak \
            tests/load/results/soak_raw.json \
            tests/load/baselines.json \
            ${{ github.event.inputs.db_size || '1M' }}

      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: results-soak, path: tests/load/results/, retention-days: 90 }

      - if: always()
        run: kill $(cat /tmp/service.pid) || true

  # ── Publish summary to PR ──────────────────────────────────────────────────
  load-test-summary:
    name: "Load Test Summary"
    runs-on: ubuntu-latest
    needs:
      - load-events-steady
      - load-multi-contract
      - load-filter-scenarios
    if: always() && github.event_name == 'pull_request'
    # Needs write access to post PR comments.
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download all results
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: results-*
          merge-multiple: true
          path: tests/load/results/

      - name: Post PR comment
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const fs = require("fs");
            const resultsDir = "tests/load/results";
            const files = fs.existsSync(resultsDir) ? fs.readdirSync(resultsDir) : [];

            let body = "## 📊 Load Test Results\n\n";

            const scenarios = [
              { file: "events_steady_raw.json",    label: "Events Steady (100 req/s)" },
              { file: "multi_contract_raw.json",   label: "Multi-Contract Queries"     },
              { file: "filter_scenarios_raw.json", label: "Filter Combinations"        },
            ];

            for (const s of scenarios) {
              const fpath = `${resultsDir}/${s.file}`;
              if (!fs.existsSync(fpath)) {
                body += `### ${s.label}\n_Results not available_\n\n`;
                continue;
              }
              try {
                const data = JSON.parse(fs.readFileSync(fpath, "utf8"));
                const met  = data.metrics || {};
                const p99  = (m) => {
                  const v = met[m]?.values?.["p(99)"];
                  return v !== undefined ? v.toFixed(1) + " ms" : "n/a";
                };
                const err  = (m) => {
                  const v = met[m]?.values?.rate;
                  return v !== undefined ? (v * 100).toFixed(3) + " %" : "n/a";
                };
                body += `### ${s.label}\n`;
                body += `| Metric | Value |\n|---|---|\n`;
                if (s.file.includes("events_steady")) {
                  body += `| p99 latency | ${p99("events_latency")} |\n`;
                  body += `| Error rate  | ${err("events_errors")} |\n`;
                } else if (s.file.includes("filter_scenarios")) {
                  body += `| Simple filter p99   | ${p99("fs_simple_filter_ms")} |\n`;
                  body += `| Range filter p99    | ${p99("fs_range_filter_ms")} |\n`;
                  body += `| Combined filter p99 | ${p99("fs_combined_filter_ms")} |\n`;
                  body += `| Error rate          | ${err("fs_error_rate")} |\n`;
                } else {
                  body += `| Contract query p99 | ${p99("mc_contract_latency_ms")} |\n`;
                  body += `| Filter query p99   | ${p99("mc_filter_latency_ms")} |\n`;
                  body += `| Error rate         | ${err("mc_error_rate")} |\n`;
                }
                body += "\n";
              } catch (e) {
                body += `### ${s.label}\n_Could not parse results: ${e.message}_\n\n`;
              }
            }

            body += "_Full results available as workflow artifacts (retained 30 days)._\n";

            github.rest.issues.createComment({
              owner:    context.repo.owner,
              repo:     context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
