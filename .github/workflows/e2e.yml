name: E2E Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Minimal default permissions.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  e2e:
    name: End-to-End Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # -----------------------------------------------------------------------
      # Rust toolchain + cache
      # -----------------------------------------------------------------------
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          save-if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}

      # -----------------------------------------------------------------------
      # Build deps needed by the test binary
      # -----------------------------------------------------------------------
      - name: Install system dependencies
        run: sudo apt-get install -y libpq-dev pkg-config libssl-dev

      # -----------------------------------------------------------------------
      # Spin up the full E2E stack
      # -----------------------------------------------------------------------
      - name: Build and start E2E stack
        run: |
          docker compose -f docker-compose.e2e.yml build
          docker compose -f docker-compose.e2e.yml up -d --wait
        timeout-minutes: 15

      # -----------------------------------------------------------------------
      # Seed the database
      # -----------------------------------------------------------------------
      - name: Seed E2E database
        run: |
          docker compose -f docker-compose.e2e.yml exec -T db \
            psql -U e2e -d soroban_pulse_e2e \
            -f /dev/stdin < tests/e2e/seed.sql
        # Allow failure — seed data is optional if the indexer has already run
        continue-on-error: true

      # -----------------------------------------------------------------------
      # Run E2E tests
      # -----------------------------------------------------------------------
      - name: Run E2E tests
        env:
          E2E_BASE_URL: http://localhost:3001
          E2E_WEBHOOK_URL: http://localhost:9001
          E2E_RPC_ADMIN_URL: http://localhost:8080
        run: cargo test --test e2e_tests -- --test-threads=1 --nocapture

      # -----------------------------------------------------------------------
      # Collect logs on failure
      # -----------------------------------------------------------------------
      - name: Dump service logs on failure
        if: failure()
        run: docker compose -f docker-compose.e2e.yml logs

      # -----------------------------------------------------------------------
      # Cleanup
      # -----------------------------------------------------------------------
      - name: Tear down E2E stack
        if: always()
        run: docker compose -f docker-compose.e2e.yml down -v
