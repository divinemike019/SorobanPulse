apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "soroban-pulse.fullname" . }}-config
  labels:
    {{- include "soroban-pulse.labels" . | nindent 4 }}
data:
  {{- range $key, $value := .Values.env }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
  SERVE_DASHBOARD: {{ .Values.dashboard.enabled | toString | quote }}
  {{- with .Values.dashboard.connectSrc }}
  DASHBOARD_CONNECT_SRC: {{ join "," . | quote }}
  {{- end }}
