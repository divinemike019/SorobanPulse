image:
  repository: soroban-pulse
  tag: latest
  pullPolicy: IfNotPresent
imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

replicaCount: 2

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: [ALL]
  readOnlyRootFilesystem: true

terminationGracePeriodSeconds: 30
strategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 0
    maxSurge: 1

service:
  type: ClusterIP
  port: 80
  targetPort: 3000

resources:
  requests:
    cpu: "100m"
    memory: "256Mi"
  limits:
    cpu: "1000m"
    memory: "512Mi"

env:
  PORT: "3000"
  STELLAR_RPC_URL: "https://soroban-testnet.stellar.org"
  INDEXER_LAG_WARN_THRESHOLD: "100"
  INDEXER_STALL_TIMEOUT_SECS: "60"
  DB_MAX_CONNECTIONS: "10"
  DB_MIN_CONNECTIONS: "2"
  ALLOWED_ORIGINS: "*"
  RATE_LIMIT_PER_MINUTE: "60"
  ENVIRONMENT: "production"
  BEHIND_PROXY: "false"
  CONTRACT_COUNT_CACHE_SIZE: "1000"
  CONTRACT_COUNT_CACHE_TTL_SECS: "30"

# Issue #1112: built-in web dashboard served by the backend at /ui.
dashboard:
  # Serve the dashboard bundled in the image (sets SERVE_DASHBOARD).
  enabled: true
  # Extra API origins the dashboard may call (appended to its CSP connect-src).
  # Leave empty when the dashboard only talks to this deployment.
  connectSrc: []

# Sensitive values — injected into a Kubernetes Secret.
# For production, prefer existingSecret (see helm/soroban-pulse/README.md).
# Never commit real credentials here; pass them via --set or a values override
# file excluded from version control.
secrets:
  databaseUrl: "postgres://<USER>:<PASSWORD>@<HOST>:5432/<DATABASE>"
  apiKey: ""
  smtpPassword: ""

# When set to a non-empty name the chart will NOT create a Secret and will
# reference this pre-existing Secret instead. The Secret must contain the same
# keys: DATABASE_URL, API_KEY, SMTP_PASSWORD.
# Recommended for production when using external-secrets, Vault Agent, or
# Sealed Secrets.
existingSecret: ""

ingress:
  enabled: false
  className: ""
  annotations: {}
  host: soroban-pulse.example.com
  tls: []

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

podDisruptionBudget:
  enabled: true
  minAvailable: 1

livenessProbe:
  path: /healthz/live
  initialDelaySeconds: 10
  periodSeconds: 10
  failureThreshold: 3

readinessProbe:
  path: /healthz/ready
  initialDelaySeconds: 5
  periodSeconds: 10
  failureThreshold: 3

extraEnv: []
nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []

# ── Prometheus Operator: ServiceMonitor ──────────────────────────────────────
# Requires the Prometheus Operator (kube-prometheus-stack or standalone) to be
# installed in the cluster.  When enabled, a ServiceMonitor is created so
# Prometheus automatically discovers and scrapes the /metrics endpoint.
serviceMonitor:
  # Set to true to create the ServiceMonitor resource.
  enabled: false
  # Override the namespace the ServiceMonitor is created in.
  # Defaults to the release namespace when left empty.
  namespace: ""
  # HTTP path Prometheus scrapes for metrics.
  path: /metrics
  # How often Prometheus scrapes the target.
  interval: 30s
  # Per-scrape timeout (must be <= interval).
  scrapeTimeout: 10s
  # Extra labels to add to the ServiceMonitor metadata.
  # Use this to match the Prometheus Operator's serviceMonitorSelector, e.g.:
  #   additionalLabels:
  #     release: kube-prometheus-stack
  additionalLabels: {}
  # Prometheus relabeling rules applied before ingestion.
  relabelings: []
  # Metric relabeling rules applied after scraping.
  metricRelabelings: []

# ── Prometheus Operator: PrometheusRule ──────────────────────────────────────
# Creates a PrometheusRule containing all alerting rules from docs/alerts.yml.
# Requires the Prometheus Operator CRD to be present.
prometheusRule:
  # Set to true to create the PrometheusRule resource.
  enabled: false
  # Override the namespace the PrometheusRule is created in.
  # Defaults to the release namespace when left empty.
  namespace: ""
  # Extra labels to add to the PrometheusRule metadata.
  # Use this to match the Prometheus Operator's ruleSelector, e.g.:
  #   additionalLabels:
  #     release: kube-prometheus-stack
  additionalLabels: {}

# ── Kubernetes NetworkPolicy ──────────────────────────────────────────────────
# When enabled, a NetworkPolicy is applied to the pods so that:
#   Ingress: only the ingress controller and Prometheus may reach the service port.
#   Egress:  pods may only connect to PostgreSQL, the Stellar RPC endpoint, and DNS.
# Requires a CNI plugin that enforces NetworkPolicies (e.g. Calico, Cilium, Weave).
networkPolicy:
  # Set to true to create the NetworkPolicy resource.
  enabled: false

  # Selectors for the ingress controller pods/namespace.
  # Adjust to match your cluster's ingress controller.
  # Example for ingress-nginx installed via the official chart:
  #   ingressController:
  #     namespaceSelector:
  #       matchLabels:
  #         kubernetes.io/metadata.name: ingress-nginx
  #     podSelector:
  #       matchLabels:
  #         app.kubernetes.io/name: ingress-nginx
  ingressController:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: ingress-nginx
    podSelector:
      matchLabels:
        app.kubernetes.io/name: ingress-nginx

  # Selectors for Prometheus pods/namespace.
  # Example for kube-prometheus-stack:
  #   prometheus:
  #     namespaceSelector:
  #       matchLabels:
  #         kubernetes.io/metadata.name: monitoring
  #     podSelector:
  #       matchLabels:
  #         app.kubernetes.io/name: prometheus
  prometheus:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: monitoring
    podSelector:
      matchLabels:
        app.kubernetes.io/name: prometheus

  egress:
    # TCP port used to reach PostgreSQL (default: 5432).
    postgresPort: 5432
    # TCP port used to reach the Stellar Soroban RPC endpoint over HTTPS (default: 443).
    rpcPort: 443
    # Additional egress ports to allow (e.g. SMTP, external APIs).
    # Each entry must have a port field and an optional protocol (defaults to TCP).
    # extraPorts:
    #   - port: 587
    #     protocol: TCP
    extraPorts: []

# ── Grafana dashboard ConfigMap ───────────────────────────────────────────────
# Creates a ConfigMap containing the pre-built Grafana dashboard JSON.
# When the Grafana sidecar (grafana-sc-dashboard) is running it will
# automatically load any ConfigMap labelled with the configured sidecar label.
grafana:
  dashboardConfigMap:
    # Set to true to create the ConfigMap.
    enabled: false
    # Namespace to create the ConfigMap in.
    # Defaults to the release namespace when left empty.
    namespace: ""
    # Label key/value that the Grafana sidecar watches.
    # Must match grafana.sidecar.dashboards.label in your Grafana Helm values.
    sidecarLabel: grafana_dashboard
    sidecarLabelValue: "1"
    # Extra labels added to the ConfigMap metadata.
    additionalLabels: {}
    # Annotations added to the ConfigMap metadata.
    # Use grafana_dashboard_folder to place the dashboard in a specific folder:
    #   annotations:
    #     grafana_dashboard_folder: SorobanPulse
    annotations: {}
